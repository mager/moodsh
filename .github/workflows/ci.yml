name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Exercise native shell integrations
        shell: bash
        run: |
          set -o pipefail
          python scripts/test_shells.py target/debug/moodsh${{ runner.os == 'Windows' && '.exe' || '' }} 2>&1 | tee shell-test.log || {
            echo "::error title=Shell integration test failed::$(tail -n 1 shell-test.log)"
            exit 1
          }
      - name: Exercise terminal-colored directory paths
        shell: bash
        run: python scripts/test_shells.py target/debug/moodsh${{ runner.os == 'Windows' && '.exe' || '' }} --terminal-path
      - name: Exercise Git shortcuts
        shell: bash
        run: python scripts/test_shortcuts.py target/debug/moodsh${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Exercise gprom against local Git repositories
        shell: bash
        run: python scripts/test_gprom.py target/debug/moodsh${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Exercise interactive picker in a PTY
        if: runner.os != 'Windows'
        run: python scripts/test_picker.py target/debug/moodsh
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: cargo build --locked
      - run: node web/scripts/check-cli.mjs target/debug/moodsh
